project:
  type: website
  render:
    - index.qmd
    - about.qmd
    - work/*.qmd
    - teaching/*.qmd
    - ma206_course.qmd
    - code_annex.qmd

website:
  title: "Jonathan Day"
  description: "Operations research, statistics, and simulation. Portfolio of Jonathan Day."
  site-url: https://lonespear.github.io
  repo-url: https://github.com/lonespear/lonespear.github.io
  open-graph: true
  page-navigation: true
  navbar:
    left:
      - href: work/index.qmd
        text: Work
      - href: teaching/index.qmd
        text: Teaching
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/lonespear
        aria-label: GitHub
  page-footer:
    left: |
      The views expressed here are my own and do not reflect the official policy or position of
      the United States Military Academy, the Department of the Army, the Department of Defense,
      or the U.S. Government.
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [flatly, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    css: styles.css
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    toc: true
    toc-depth: 3
    fig-align: center
    link-external-newwindow: true
    smooth-scroll: true
